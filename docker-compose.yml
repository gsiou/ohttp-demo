version: "3.9"

services:
  client:
    build: ./client
    ports:
      - "4173:5173"
    environment:
      - VITE_RELAY_URL=http://localhost:4001
      - VITE_GATEWAY_URL=http://localhost:4002
    depends_on:
      - relay
    volumes:
      - ./client/public:/app/public:rw
      - ./client/src:/app/src:rw
      - ./client/.env:/app/.env:ro
      - ./client/index.html:/app/index.html:rw
      - type: tmpfs
        target: /app/node_modules/.vite
        tmpfs:
          mode: 01777
      - type: tmpfs
        target: /app/node_modules/.vite-temp
        tmpfs:
          mode: 01777

  relay:
    build: ./nginx
    ports:
      - "4001:80"
    depends_on:
      - gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build: ./gateway
    ports:
      - "4002:3002"
    environment:
      - PORT=3002
      - DOWNSTREAM_URL=http://target:3003
    depends_on:
      - target
    volumes:
      - ./gateway/src:/app/src
      - ./gateway/package.json:/app/package.json:rw
    command: ["npm", "run", "dev"]

  target:
    build: ./target
    ports:
      - "4003:3003"
    environment:
      - PORT=3003
    volumes:
      - ./target/src:/app/src
      - ./target/package.json:/app/package.json:rw
    command: ["npm", "run", "dev"]